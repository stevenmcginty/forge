name: Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The fast lane plus the three heavy checks a hosted runner can actually
      # satisfy — real pwsh through node-pty, and two real WebSocket servers.
      # See the `ci` flag in scripts/run-checks.mjs for where the line is drawn
      # and why it exists: CI used to run the fast lane alone, and web:smoke sat
      # failing long enough that its lockout phase was asserting a door the code
      # had deliberately rebuilt. The rest of the heavy lane needs the `claude`
      # or `codex` CLI, a Firebase emulator, cloud quota or a build artifact, so
      # it stays `npm run test:all` at a desk.
      - name: Run the check suite
        run: npm run test:ci
