// Forge Watch — Wear OS companion for Forge.
// :app       — Kotlin app: dictation activity + cellular warm-up service.
// :watchface — Watch Face Format (declarative XML, no code) face with a
//              dictation shortcut that launches the app.

plugins {
    id 'com.android.application' version '8.7.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.25' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
