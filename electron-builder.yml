# Packaging Forge for Windows.
#
# One artifact, on purpose:
#   Forge-<ver>-setup.exe   NSIS, per-user, no admin prompt
#
# There was a Forge-<ver>-win.zip here too — unzip and run, nothing installed.
# It is gone because it could not update itself: latest.yml advertises only the
# NSIS artifact and electron-updater has no zip path on Windows, so anyone who
# took the zip stayed on that build forever while the app cheerfully reported
# it was up to date. It was also the larger, more obvious download of the two.
# One artifact that nobody can pick wrongly beats two and a caveat in a README.
#
#   npm run dist      build into release/
#   npm run release   build, verify the feed, tag and publish
#
# Everything below has a matching path-resolution site in the source; if you
# change a `to:` here, change the resolver too:
#   resources/bridge/gemini-bridge.mjs  ← electron/bridge/mcp-config.ts
#                                          scriptCandidates()
#                                          (the esbuild bundle, not the source —
#                                           see scripts/build-bridge.mjs)
#   resources/stt-bin/forge-stt.exe     ← electron/stt-sidecar.ts resolveFrozen()
#   resources/stt/stt_service.py        ← electron/stt-sidecar.ts resolveScript()
#   resources/mobile-web/               ← electron/mobile-host.ts mobileWebRoot()
#                                          (the phone bundle the Devices preview
#                                           frames and the browser route serve)
#   resources/icon.ico                  ← electron/tray.ts iconCandidates()
#   resources/icon-dev.ico              ← ditto, for the dev channel
#   resources/foreman-kit/              ← electron/foreman/kit-path.ts
#                                          foremanKitDir()

appId: dev.forge.app
productName: Forge
copyright: Forge
# Matches app.setAppUserModelId in electron/main.ts, so the taskbar groups
# windows under the icon rather than under a generic Electron entry.

directories:
  output: release
  buildResources: build

# The renderer, main and preload bundles, plus package.json for the version and
# the `main` entry. Source is not shipped: electron-vite has already bundled it.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

# --------------------------------------------------------------- resources
#
# These sit *beside* app.asar in resources/, not inside it. All three are things
# that are executed or read by path rather than imported:
#
#  - the MCP bridge is spawned by `node <path>` from inside a Claude pane, which
#    cannot read out of an asar. It is shipped as the esbuild *bundle*, because
#    there is no node_modules beside it out here for its MCP SDK imports to
#    resolve against.
#  - the frozen speech engine is a PyInstaller folder; its bootloader resolves
#    its own DLLs relative to the exe
#  - stt_service.py is the fallback for anyone running the sidecar under their
#    own interpreter
#  - the tray icon is read off disk by `nativeImage.createFromPath`. It is the
#    same .ico electron-builder stamps onto Forge.exe, but the stamp lives in
#    the binary's resource table where nothing can read it back — and the file
#    itself is in build/, which is `buildResources` and is not shipped. Without
#    a copy out here a packaged Forge has no image for the notification area,
#    and an icon with no image is a hidden Forge with no visible way back.
extraResources:
  - from: build/icon.ico
    to: icon.ico
  # The watchdog is run by a scheduled task as `Forge.exe --run-as-node
  # <script>`, by path, outside the app — see electron/watchdog-host.ts.
  - from: scripts/watchdog.mjs
    to: watchdog/watchdog.mjs
  - from: Start Forge Watchdog.vbs
    to: watchdog/Start Forge Watchdog.vbs
  - from: build/icon-dev.ico
    to: icon-dev.ico
  - from: bridge-dist
    to: bridge
    filter:
      - '**/*'
  - from: stt-dist/forge-stt
    to: stt-bin
    filter:
      - '**/*'
  - from: stt
    to: stt
    filter:
      - stt_service.py
  # The phone bundle, read by path because MobileServer serves it as files. A
  # packaged Forge has no checkout to build it from, so without this copy the
  # browser route would be gone and the Devices preview would have nothing to
  # frame — `npm run dist` builds mobile/dist first for exactly this reason.
  - from: mobile/dist
    to: mobile-web
    filter:
      - '**/*'
  # The skills and agents Foreman types into a Claude pane — `/gaffer`,
  # `/fable-method` and the three subagents gaffer spawns. Claude Code reads
  # those out of the *user's* ~/.claude, so a machine that has never had them
  # answers "unknown command" and Foreman is a button that does nothing.
  # electron/foreman/kit.ts copies them across on first run, which it can only
  # do if they were shipped. Refill the folder with `npm run foreman-kit:sync`.
  - from: assets/foreman-kit
    to: foreman-kit
    filter:
      - '**/*'

asar: true
# node-pty's conpty.node / conpty.dll and its OpenConsole.exe are loaded by the
# OS, which cannot see inside an asar. The whole package comes out rather than
# just the binaries, because its worker threads are spawned by file path too.
asarUnpack:
  - '**/node_modules/@lydell/node-pty/**'
  - '**/node_modules/@lydell/node-pty-*/**'

# @lydell/node-pty ships prebuilt binaries and has no gyp step; there is nothing
# to rebuild, and letting electron-builder try invites a toolchain it does not
# need.
npmRebuild: false
buildDependenciesFromSource: false

# A leaked key must stop the build *before* an installer exists, not after — so
# the secrets audit runs against the packed app directory as an afterPack hook.
afterPack: ./scripts/after-pack.cjs

# ------------------------------------------------------------------ updates
#
# Where a packaged Forge looks for a newer one. This block is also what makes
# electron-builder emit `latest.yml` beside the artifacts, which is the file
# electron-updater actually reads — without it, a packaged build has no feed
# and reports "up to date" forever.
#
# Nothing here is a secret. The GitHub provider reads *public* releases with an
# unauthenticated request; publishing to them needs a GH_TOKEN in the
# environment of whoever runs `electron-builder --publish`, and that token is
# never written into the app, this file, or the build.
#
# The repo does not exist yet. That is handled rather than hoped for: the
# releases API answers 404, electron-updater raises, and electron/updater.ts
# classifies it as "no feed" and stays silent. See isNoFeedError() in
# shared/tools.ts.
#
# Forge is unsigned, so an auto-update replaces an unsigned exe with another
# unsigned exe. SmartScreen will have opinions and Smart App Control may refuse
# outright — README.md says so plainly, and so does the Updates & tools
# settings section.
publish:
  provider: github
  owner: stevenmcginty
  repo: forge
  releaseType: release

win:
  icon: build/icon.ico
  # Unused while NSIS is the only target — nsis.artifactName below wins — but
  # kept so that adding a target back never silently yields "Forge-0.2.0.exe".
  artifactName: ${productName}-${version}-win.${ext}
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  # Per-user, so no UAC prompt and no admin account needed.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Forge
  deleteAppDataOnUninstall: false
  # %APPDATA%\Forge holds projects, layouts and screenshots. Uninstalling the
  # app is not a request to throw those away.

# Forge is not code-signed: there is no certificate, and a self-signed one buys
# nothing but a different SmartScreen dialog. README.md explains the
# "More info → Run anyway" click that follows from that.
